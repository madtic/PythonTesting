name: CI

on:
  push:
    branches: [ "Hausaufgabe" ]
  pull_request:
    branches: [ "Hausaufgabe" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_COMPILE_BYTECODE: "1"
  UV_LINK_MODE: copy

jobs:
  ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff Check (Verbose)
        continue-on-error: true
        run: uv run ruff check --verbose

  ruff-format:
    name: Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff Format Check (Verbose)
        continue-on-error: true
        run: uv run ruff format --check --verbose

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Detailed Dependency & Security Audit
        if: always()
        run: |
          echo "=== Installed Packages Overview ==="
          uv tree
          
          echo "=== Running Detailed Pip Audit ==="
          # Standard output in console mit Verbose Details
          uv run pip-audit --verbose || true
          
          # Generiere Markdown Summary für das GitHub Workflow UI
          echo "### 🛡️ Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run pip-audit --format=desc >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Enforce Audit Pass
        run: uv run pip-audit

  ty:
    name: Typechecking (ty)
    needs: [ruff, ruff-format, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Typecheck
        run: uv run ty check

  pytest:
    name: Test (Pytest)
    needs: [ty]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Pytest with Coverage & JUnit
        run: |
          uv run pytest \
            -vv \
            --durations=10 \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml

      - name: Generate Coverage Markdown Summary
        if: always()
        run: |
          uv run --with pycobertura pycobertura show --format text coverage.xml > coverage_summary.txt || true
          echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage & Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            coverage.xml
            junit.xml

      - name: Publish Test Summary to GitHub Workflow
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'junit.xml'
          detailed_summary: true
          include_passed: true