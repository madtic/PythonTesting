stages:
  - lint
  - typechecking
  - test

variables:
  UV_CACHE_DIR: .uv-cache
  UV_COMPILE_BYTECODE: "1"
  UV_LINK_MODE: copy

default:
  interruptible: true
  image: ghcr.io/astral-sh/uv:debian-slim
  tags:
    - docker  # <--- Updated tag to target your docker runner
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

  before_script:
    - uv sync --locked

ruff:
  stage: lint
  script:
    - uv run ruff check

ruff-format:
  stage: lint
  allow_failure: true
  script:
    - uv run ruff format --check

ty:
  stage: typechecking
  script:
    - uv run ty check
    - uv run ty check --output-format=gitlab > gl-code-quality-report-ty.json || true
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report-ty.json

pytest:
  stage: test
  script:
    - uv run pytest
    - uv run pytest --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml
  coverage: '/^TOTAL.*\s+(\d+)%$/'
  artifacts:
    when: always
    paths:
      - junit.xml
      - coverage.xml
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml